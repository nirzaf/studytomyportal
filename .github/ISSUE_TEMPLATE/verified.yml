name: Verified
description: Someone from the team allowed you to create an issue here
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in Studytomy Portal 💖

        If the team did not ask you to create this issue, please use the public issue form at https://github.com/nirzaf/studytomyportal/issues/new.
  - type: checkboxes
    id: verified
    attributes:
      label: Verified issue
      description: Confirm that you are allowed to create an issue here.
      options:
        - label: Someone from the team allowed me to create an issue here
          required: true
  - type: textarea
    id: content
    attributes:
      label: Issue Content
      description: Add the content of the issue here.
